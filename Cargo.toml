[package]
name = "harprobe"
version = "0.1.0"
edition = "2021"
description = "HTTP Archive (HAR) file analysis CLI — stats, waterfall, diff, filter, and CI/CD mode"
license = "MIT"
repository = "https://github.com/EdgarOrtegaRamirez/harprobe"
keywords = ["har", "http", "archive", "analysis", "performance"]
categories = ["command-line-utilities", "web-programming", "development-tools"]

[[bin]]
name = "harprobe"
path = "src/main.rs"

[lib]
name = "harprobe"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1